<!DOCTYPE html>
<html lang="en">
<head>
  <title>image-playground</title>
  <style>
    body { margin: 0; padding: 0; height: 100%; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #fff; }
   .dropzone { border: 2px dashed; background-color: #f6f6f6; width: 50%; height: 300px; display: flex; align-items: center; justify-content: center; color: #666; font-size: 20px; cursor: pointer; }
    .dropzone.text { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #666; font-size: 30px; }
  </style>
</head>
<body>
  <div class="dropzone">
    <div class="text">Drop a gif file to proceed</div>
  </div>
</body>
</html>
